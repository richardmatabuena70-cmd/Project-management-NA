<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel & Restaurant HRMS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="login-page">

    <div class="login-card">

        <div class="logo">HR</div>

        <h1>Hotel & Restaurant</h1>
        <p>Human Resource Management System</p>

        <form id="loginForm">

            <label>Username / Email</label>
            <input type="text" id="username" required>

            <label>Password</label>
            <input type="password" id="password" required>

            <button type="submit" class="btn primary full">
                Login
            </button>

        </form>

        <button class="link-btn" onclick="registerHR()">
            Create HR / Admin Account
        </button>

        <button class="link-btn" onclick="registerApplicant()">
            Create Applicant Account
        </button>

        <button class="link-btn" onclick="guestApplicant()">
            View Job Vacancies
        </button>

    </div>

</div>


<!-- MAIN SYSTEM -->
<div id="system" class="hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <div class="logo small">HR</div>

            <div>
                <b>HRMS</b>
                <small>Hotel & Restaurant</small>
            </div>
        </div>

        <nav id="menu"></nav>

        <div class="logout-area">
            <button onclick="logout()" class="menu-btn">
                🚪 Logout
            </button>
        </div>

    </aside>


    <!-- CONTENT -->
    <main class="main">

        <header class="topbar">

            <div>
                <h2 id="pageTitle">Dashboard</h2>
                <span>Human Resource Management System</span>
            </div>

            <div class="user-info">
                <div class="avatar" id="avatar">U</div>

                <div>
                    <b id="userName">User</b>
                    <small id="userRole">User</small>
                </div>
            </div>

        </header>

        <section id="content"></section>

    </main>

</div>


<!-- MODAL -->
<div id="modal" class="modal hidden">

    <div class="modal-box">

        <div class="modal-header">

            <h3 id="modalTitle">Form</h3>

            <button onclick="closeModal()" class="close">
                ×
            </button>

        </div>

        <div id="modalContent"></div>

    </div>

</div>


<div id="toast"></div>


<script src="script.js"></script>

</body>
</html>
