<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel & Restaurant HRMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="login-page">

    <div class="login-card">

        <img class="logo" src="images/logo.png" alt="HRMS">

        <h1>Hotel & Restaurant</h1>
        <p>Human Resource Management System</p>

        <form id="loginForm">

            <label for="username">Email</label>
            <input type="text" id="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <button type="submit" class="btn primary full">
                Login
            </button>

        </form>

        <div class="register-box">

            <button class="link-btn" onclick="registerHR()">

                Create HR / Admin Account

            </button>

            <button class="link-btn" onclick="registerApplicant()">

                Create Applicant Account

            </button>

            <button class="link-btn" onclick="guestApplicant()">

                View Job Vacancies

            </button>

        </div>

    </div>

</div>


<!-- MAIN SYSTEM -->
<div id="system" class="hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <img class="logo small" src="images/logo.png" alt="HRMS">

            <div>
                <b>HRMS</b>
                <small>Hotel & Restaurant</small>
            </div>
        </div>

        <nav id="menu" aria-label="Main navigation"></nav>

        <div class="logout-area">
            <button onclick="logout()" class="menu-btn">
                🚪 Logout
            </button>
        </div>

    </aside>


    <!-- CONTENT -->
    <main class="main" role="main">

        <header class="topbar">

            <div>
                <h2 id="pageTitle">Dashboard</h2>
                <span>Human Resource Management System</span>
            </div>

            <div class="user-info">
                <div class="avatar" id="avatar">
                    <img id="avatarImg" src="" alt="">
                    <span id="avatarLetter">U</span>
                </div>

                <div>
                    <b id="userName">User</b>
                    <small id="userRole">User</small>
                </div>
            </div>

        </header>

        <section id="content"></section>

    </main>

</div>


<!-- MODAL -->
<div id="modal" class="modal hidden">

    <div class="modal-box">

        <div class="modal-header">

            <h3 id="modalTitle">Form</h3>

            <button onclick="closeModal()" class="close" aria-label="Close modal">
                ×
            </button>

        </div>

        <div id="modalContent"></div>

    </div>

</div>


<div id="toast" aria-live="polite"></div>


<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/vacancies.js"></script>
<script src="js/pages/applicants.js"></script>
<script src="js/pages/applications.js"></script>
<script src="js/pages/interviews.js"></script>
<script src="js/pages/hiring.js"></script>
<script src="js/pages/offers.js"></script>
<script src="js/pages/onboarding.js"></script>
<script src="js/pages/employees.js"></script>
<script src="js/pages/departments.js"></script>
<script src="js/pages/positions.js"></script>
<script src="js/pages/records.js"></script>
<script src="js/pages/documents.js"></script>
<script src="js/pages/leave.js"></script>
<script src="js/pages/reports.js"></script>
<script src="js/pages/profile.js"></script>
<script src="js/main.js"></script>

</body>
</html>
